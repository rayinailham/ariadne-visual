<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Penjelasan visual mekanisme pencarian semantik berbasis RAG untuk pemetaan bakat multi-instrumen psikometrik pada ekosistem backend FutureGuide."
    />
    <title>Ariadne: visual skripsi FutureGuide</title>
    <script>
      // Pasang tema sebelum render agar tidak ada kedip warna.
      try {
        var t = localStorage.getItem('ariadne-tema')
        if (t === 'gelap' || t === 'terang') {
          document.documentElement.setAttribute('data-tema', t)
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
